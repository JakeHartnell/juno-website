name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - 'juno-agent/**'
      - 'ci/**'
  push:
    branches:
      - main
      - develop
      - 'juno-agent/**'
      - 'ci/**'

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Yarn 1
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Validate DEX registry JSON
        run: |
          if [ -f public/dex/registry.juno-1.json ]; then
            node -e "const fs = require('fs'); const path = 'public/dex/registry.juno-1.json'; JSON.parse(fs.readFileSync(path, 'utf8')); console.log(path + ' is valid JSON');"
          else
            echo "public/dex/registry.juno-1.json not present; skipping"
          fi

      - name: Lint
        run: yarn run lint

      - name: Type-check
        run: yarn run type-check

      - name: Build
        run: yarn run build
